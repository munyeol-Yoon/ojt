      href="https://cdn.jsdelivr.net/npm/reset-css@4.0.1/reset.min.css"
    />
  <link rel="stylesheet" href="./style.css" />
  <title>my todo app</title>
</head>
<body>
  <div id="root">

        </div>
      </section>
  
      <section>
        <h3 class="subTitle">TODO</h3>

        <ul id="todo-list">
        </ul>
      </section>
      
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
